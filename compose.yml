services:
  # ==============================================================================
  # INFRAESTRUCTURA BASE (Backing Services)
  # ==============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus123
      POSTGRES_DB: nexus_main
      # Script de inicialización creará las bases aisladas para cada bounded context
      POSTGRES_MULTIPLE_DATABASES: nexus_auth,nexus_catalog,nexus_orders,nexus_recommendations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_main"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus_net

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus_net

  # ==============================================================================
  # 1. AUTENTICACIÓN Y AUTORIZACIÓN (Auth Service)
  # ==============================================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: nexus_auth_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://nexus:nexus123@postgres:5432/nexus_auth
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - JWT_ALGORITHM=HS256
      - COGNITO_REGION=${COGNITO_REGION:-us-east-1}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID:-}
      # Desarrollo con Docker sin Cognito: modo local explícito (en EKS se deja en false).
      - AUTH_LOCAL_MODE=${AUTH_LOCAL_MODE:-true}
      - LOCAL_ADMIN_EMAILS=${LOCAL_ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus_net

  # ==============================================================================
  # 2. CATÁLOGO DE PRODUCTOS (Catalog Service)
  # ==============================================================================
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: nexus_catalog_service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - DATABASE_URL=postgresql+asyncpg://nexus:nexus123@postgres:5432/nexus_catalog
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus_net

  # ==============================================================================
  # 3. CARRITO DE COMPRAS (Cart Service - In-Memory Fast Path)
  # ==============================================================================
  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    container_name: nexus_cart_service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - REDIS_URL=redis://redis:6379/0
      - CATALOG_SERVICE_URL=http://catalog-service:8000
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - nexus_net

  # ==============================================================================
  # 4. GESTIÓN DE ÓRDENES Y PAGOS (Orders Service - Saga & Outbox)
  # ==============================================================================
  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    container_name: nexus_orders_service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - DATABASE_URL=postgresql+asyncpg://nexus:nexus123@postgres:5432/nexus_orders
      - CATALOG_SERVICE_URL=http://catalog-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - nexus_net

  # ==============================================================================
  # 5. SISTEMA DE NOTIFICACIONES (Notifications Service - Event Consumer)
  # ==============================================================================
  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    container_name: nexus_notifications_service
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME="Nexus Digital Store 🎮"
    networks:
      - nexus_net

  # ==============================================================================
  # 6. MOTOR DE RECOMENDACIONES (Recommendations Service)
  # ==============================================================================
  recommendations-service:
    build:
      context: .
      dockerfile: services/recommendations-service/Dockerfile
    container_name: nexus_recommendations_service
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - DATABASE_URL=postgresql+asyncpg://nexus:nexus123@postgres:5432/nexus_recommendations
      - REDIS_URL=redis://redis:6379/1
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-nexus-catalog}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus_net

  # ==============================================================================
  # 7. CHATBOT BASADO EN LLM (AI Agent Service - Streaming SSE)
  # ==============================================================================
  ai-agent-service:
    build:
      context: .
      dockerfile: services/ai-agent-service/Dockerfile
    container_name: nexus_ai_agent_service
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - PORT=8000
      # Verificación de JWT locales (sin Cognito). Sin este valor el servicio rechaza todo token (fail-closed).
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-local-development}
      - REDIS_URL=redis://redis:6379/2
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      - GROQ_TEMPERATURE=0.1
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-nexus-catalog}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-catalog}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - CATALOG_SERVICE_URL=http://catalog-service:8000
      - ENABLE_CREWAI_ORCHESTRATION=${ENABLE_CREWAI_ORCHESTRATION:-false}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - nexus_net

# ==============================================================================
# VOLÚMENES Y REDES
# ==============================================================================
volumes:
  postgres_data:
    name: nexus_postgres_data
  redis_data:
    name: nexus_redis_data
  hf_cache:
    name: nexus_hf_cache

networks:
  nexus_net:
    name: nexus_network
    driver: bridge
