[project]
name = "nexus-events"
version = "0.1.0"
description = "Domain Event Schemas and Messaging (Amazon SNS/SQS) for Nexus Microservices"
requires-python = ">=3.11"
dependencies = [
    "nexus-core",
    "pydantic>=2.7.0",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

