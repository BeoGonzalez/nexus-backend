[project]
name = "nexus-security"
version = "0.1.0"
description = "Security, JWT verification, and Auth guards for Nexus Microservices"
requires-python = ">=3.11"
dependencies = [
    "nexus-core",
    "pyjwt[crypto]>=2.8.0",
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

