[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication & Authorization Microservice for Nexus Digital Store"
requires-python = ">=3.11"
dependencies = [
    "nexus-core",
    "nexus-security",
    "nexus-events",
    "fastapi[standard]>=0.110.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

