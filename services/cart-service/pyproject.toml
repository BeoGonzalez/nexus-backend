[project]
name = "cart-service"
version = "0.1.0"
description = "Shopping Cart Microservice (Redis Fast-path) for Nexus Digital Store"
requires-python = ">=3.11"
dependencies = [
    "nexus-core",
    "nexus-security",
    "fastapi[standard]>=0.110.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

