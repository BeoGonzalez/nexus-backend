[project]
name = "ai-agent-service"
version = "0.1.0"
description = "Conversational LLM Agent & RAG Shopping Assistant for Nexus Digital Store"
requires-python = ">=3.11"
dependencies = [
    "nexus-core",
    "nexus-security",
    "fastapi[standard]>=0.110.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.11",
    "crewai>=1.15.28",
    "litellm>=1.106.0",
    "pinecone>=7.3.0",
    "sentence-transformers>=6.0.0",
    "torch",
    "wikipedia>=1.4.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

