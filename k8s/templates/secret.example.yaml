# PLANTILLA SIN VALORES REALES. NO se aplica con `kubectl apply -k k8s/`: está fuera de kustomization.yaml
# a propósito (aplicarla pisaría los Secrets reales con marcadores).
#
# En el Learner Lab estos Secrets los crea nexus-infrastructure/k8s/scripts/deploy.sh desde AWS Secrets Manager.
# Para crearlos a mano (nunca los guardes en Git ni en el historial de la shell):
#
#   kubectl -n nexus create secret generic catalog-env \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://<usuario>:<password>@<writer-endpoint>:5432/nexus_catalog' \
#     --from-literal=SERVICE_ENV=aws
#
# Claves por Secret (deben coincidir con los secretKeyRef de k8s/services/*.yaml):
#   auth-env: SERVICE_ENV
#   catalog-env: DATABASE_URL, SERVICE_ENV
#   cart-env: REDIS_URL, SERVICE_ENV
#   orders-env: DATABASE_URL, SERVICE_ENV
#   notifications-env: EVENTS_QUEUE_URL, SMTP_USER, SMTP_PASSWORD, SERVICE_ENV
#   recommendations-env: REDIS_URL, PINECONE_API_KEY, SERVICE_ENV
#   ai-agent-env: REDIS_URL, GROQ_API_KEY, PINECONE_API_KEY, TAVILY_API_KEY, LANGCHAIN_API_KEY, SMTP_USER, SMTP_PASSWORD, GMAIL_USER, GMAIL_APP_PASSWORD, SERVICE_ENV
apiVersion: v1
kind: Secret
metadata:
  name: auth-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  DATABASE_URL: "<database_url>"
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: cart-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  REDIS_URL: "<redis_url>"
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  DATABASE_URL: "<database_url>"
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  EVENTS_QUEUE_URL: "<events_queue_url>"
  SMTP_USER: "<smtp_user>"
  SMTP_PASSWORD: "<smtp_password>"
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: recommendations-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  REDIS_URL: "<redis_url>"
  PINECONE_API_KEY: "<pinecone_api_key>"
  SERVICE_ENV: "<service_env>"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-env
  namespace: nexus
  annotations:
    nexus.io/template: "true"
type: Opaque
stringData:
  REDIS_URL: "<redis_url>"
  GROQ_API_KEY: "<groq_api_key>"
  PINECONE_API_KEY: "<pinecone_api_key>"
  TAVILY_API_KEY: "<tavily_api_key>"
  LANGCHAIN_API_KEY: "<langchain_api_key>"
  SMTP_USER: "<smtp_user>"
  SMTP_PASSWORD: "<smtp_password>"
  GMAIL_USER: "<gmail_user>"
  GMAIL_APP_PASSWORD: "<gmail_app_password>"
  SERVICE_ENV: "<service_env>"
