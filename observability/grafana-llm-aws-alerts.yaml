# Alertas del modelo de IA (métricas OpenTelemetry del ai-agent) y de la plataforma AWS/EKS (CloudWatch vía la
# EC2 collector, kube-state-metrics y postgres_exporter vía Alloy). Mismo formato y variables que
# grafana-eks-security-alerts.yaml: sustituye ${GRAFANA_PROMETHEUS_UID} (en Grafana Cloud: grafanacloud-prom).
#
# Las métricas de CloudWatch usan regex en __name__ porque el exporter normaliza nombres como HTTPCode_Target_5XX_Count.
apiVersion: 1
groups:
- orgId: 1
  name: nexus-llm-metrics
  folder: Nexus EKS
  interval: 1m
  rules:
  - uid: nexus-llm-token-burn
    title: Consumo de tokens del LLM acelerado (denial of wallet)
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: LLM06
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} tokens en la última hora'
      description: Más de 30.000 tokens/hora (20% del presupuesto diario de 150.000). Revisa usuarios con más consumo en Loki (security_event=llm.request)
        y nexus_llm_quota_rejections_total.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(increase(nexus_llm_tokens_total[1h]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 30000
  - uid: nexus-llm-fallback-ratio
    title: El asistente responde con respaldo (proveedor caído o key revocada)
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      owasp: LLM06
      team: backend
    annotations:
      summary: '{{ humanizePercentage $values.A.Value }} de respuestas sin el modelo'
      description: 'Más del 30% de las respuestas usan el respaldo o expiran. Causa típica: GROQ_API_KEY revocada (HTTP 401) o límite del proveedor.
        Revisa los logs del ai-agent.'
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 1200
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(rate(nexus_llm_requests_total{outcome!="ok"}[10m])) / clamp_min(sum(rate(nexus_llm_requests_total[10m])), 1e-9)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.3
  - uid: nexus-llm-site-budget-exhausted
    title: Presupuesto global de tokens agotado (503 para todos)
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: LLM06
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} peticiones rechazadas por límite global'
      description: Se alcanzó un límite de sitio (tokens/min, tokens/día o peticiones/día). Si es tráfico legítimo, sube LLM_GLOBAL_* respetando
        los límites de Groq; si no, investiga abuso.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(increase(nexus_llm_quota_rejections_total{reason=~"global_.*"}[15m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: nexus-llm-attack-burst
    title: Ráfaga de ataques al modelo (inyección / fuga de system prompt)
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      owasp: LLM01
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} eventos de ataque en 15 min'
      description: Más de 5 intentos de inyección o fugas bloqueadas en 15 min. Correlaciona user_sub en Loki (llm.prompt_injection_suspected,
        llm.system_prompt_leak_blocked).
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(increase(nexus_llm_security_events_total{event=~"prompt_injection|system_prompt_leak"}[15m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
- orgId: 1
  name: nexus-aws-platform
  folder: Nexus EKS
  interval: 5m
  rules:
  - uid: aws-alb-5xx
    title: 'ALB: errores 5xx'
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      owasp: A10
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} errores 5xx en el ALB'
      description: El frontend o el ALB devuelven 5xx. Revisa targets no sanos (aws_applicationelb_un_healthy_host_count) y los logs del frontend.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(max_over_time({__name__=~"aws_applicationelb_httpcode_(target|elb)_5.*_count_sum"}[15m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
  - uid: aws-apigw-5xx
    title: 'API Gateway: errores 5xx hacia el backend'
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      owasp: A10
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} errores 5xx en API Gateway'
      description: Fallos entre API Gateway, el NLB y los NodePorts de EKS. Revisa pods no Ready y la VPC Link.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(max_over_time({__name__=~"aws_apigateway_5_?xxerror_sum"}[15m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
  - uid: aws-waf-blocked-spike
    title: 'WAF: pico de peticiones bloqueadas (ataque en curso)'
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: A05
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} peticiones bloqueadas por el WAF'
      description: 'Más de 100 bloqueos en 15 min: escaneo, fuerza bruta o inyección. Revisa qué regla bloquea (dimensión Rule) y las IPs en los
        logs del WAF.'
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(max_over_time({__name__=~"aws_wafv2_blocked_requests_sum"}[15m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 100
  - uid: aws-sqs-dlq
    title: 'SQS: mensajes en la cola de mensajes fallidos (DLQ)'
    condition: C
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: A10
      team: backend
    annotations:
      summary: '{{ humanize $values.A.Value }} mensajes en la DLQ'
      description: notifications-service no pudo procesar eventos (boletas). Revisa sus logs y reprocesa la DLQ.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: max({__name__=~"aws_sqs_approximate_number_of_messages_visible_maximum", dimension_QueueName=~".*dlq.*"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: aws-aurora-cpu
    title: 'Aurora: CPU alta'
    condition: C
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: A10
      team: backend
    annotations:
      summary: CPU de Aurora al {{ humanize $values.A.Value }}%
      description: CPU sostenida sobre 80%. Revisa consultas lentas en pg_stat_statements (dashboard PostgreSQL) y conexiones.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: max({__name__=~"aws_rds_cpu_?utilization_average"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 80
  - uid: aurora-connections-saturation
    title: 'Aurora: conexiones cerca del máximo'
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: A10
      team: backend
    annotations:
      summary: '{{ humanizePercentage $values.A.Value }} de max_connections en uso'
      description: Revisa pool_size/max_overflow de los microservicios y conexiones colgadas.
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum(pg_stat_database_numbackends) / clamp_min(max(pg_settings_max_connections), 1)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.8
  - uid: k8s-pods-pending
    title: 'Kubernetes: pods en Pending (falta de memoria o de IPs en los nodos)'
    condition: C
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      owasp: A10
      team: backend
    annotations:
      summary: '{{ $labels.namespace }}: {{ humanize $values.A.Value }} pods en Pending'
      description: 'Pods sin agendar 15 min (FailedScheduling: Insufficient memory / Too many pods). Considera un tercer nodo en el node group.'
    data:
    - refId: A
      datasourceUid: ${GRAFANA_PROMETHEUS_UID}
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        instant: true
        expr: sum by (namespace) (kube_pod_status_phase{phase="Pending", namespace=~"nexus|observability"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
