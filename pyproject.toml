[project]
name = "nexus-digital-store"
version = "0.1.0"
description = "E-Commerce Microservices Workspace for Nexus Digital Store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis,rabbitmq]>=4.8",
    "respx>=0.21",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "moto[sns,sqs]>=5.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
    "cyclonedx-bom>=5",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
nexus-core = { workspace = true }
nexus-security = { workspace = true }
nexus-events = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/*/tests", "services/*/tests", "tests/integration", "tests/security"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["tests_support"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]
markers = [
    "integration: requiere Docker (Testcontainers)",
    "bug(reason): documenta un bug conocido del codigo de produccion",
]
